  <style>
    * {
      color: #ccc;
      text-decoration: none;
      font-family: 'Advent Pro', sans-serif;
      font-size: .5em;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    html {
      background: #6b6a63;
    }

    /* iOS Safari ignores background-attachment: fixed, so a fixed layer
       paints the GIF edge to edge instead of leaving bands at the top and bottom. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: #6b6a63 url(https://media.giphy.com/media/l4hLyOGRJWNSR8QQ8/giphy.gif) no-repeat center center;
      background-size: cover;
    }

    footer credit {
      position: absolute;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
    }

    footer contact {
      position: absolute;
      left: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>
  <footer>
    <contact>
    </contact>
    <credit>
      <a href="https://giphy.com/gifs/cinemagraph-cinemagraphs-l4hLyOGRJWNSR8QQ8">
